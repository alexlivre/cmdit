name: Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug"]
assignees: ""
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Thanks for reporting! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: Describe the bug in detail...
    validations:
      required: true

  - type: input
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the bug
      placeholder: "1. Open cmdit\n2. ...\n3. ..."
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: "..."
    validations:
      required: true

  - type: input
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: "..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      description: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: "go version go1.23.6 windows/amd64"

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots, logs, or other relevant info
      placeholder: Add any extra context here...